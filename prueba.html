<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Design Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    background:#f5f5f5;
    color:#111;
}

/* NAV */
nav{
    position:absolute;
    top:20px;
    right:40px;
}

nav a{
    margin-left:20px;
    text-decoration:none;
    color:#111;
    font-weight:500;
}

/* HERO */
.hero{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 80px;
    background:#f5f5f5;
}

.hero img{
    width:450px;
}

.hero-text{
    max-width:500px;
}

.hero h1{
    font-size:48px;
    font-weight:700;
}

.hero p{
    margin:20px 0;
    color:#555;
}

.btn{
    display:inline-block;
    padding:10px 20px;
    background:#111;
    color:#fff;
    text-decoration:none;
    font-size:14px;
}

/* DARK SECTION */
.dark{
    background:linear-gradient(90deg,#000,#3b0000);
    color:#fff;
    padding:80px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.dark img{
    width:400px;
}

.dark h2{
    font-size:42px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    padding:40px;
}

.grid img{
    width:100%;
    height:200px;
    object-fit:cover;
    background:#ddd;
}

/* FINAL */
.cta{
    padding:100px 80px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.cta img{
    width:400px;
}

.cta h2{
    font-size:48px;
}

/* RESPONSIVE */
@media(max-width:900px){
    .hero, .dark, .cta{
        flex-direction:column;
        text-align:center;
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Portfolio</a>
    <a href="#">Contact</a>
</nav>

<!-- HERO -->
<section class="hero">
    <img src="https://via.placeholder.com/400x500" alt="">
    <div class="hero-text">
        <h1>Character Design Studio</h1>
        <p>Browse my gallery of recent freelance projects I did over the last 3 years</p>
        <a href="#" class="btn">View my work</a>
    </div>
</section>

<!-- DARK SECTION -->
<section class="dark">
    <img src="https://via.placeholder.com/400x400" alt="">
    <div>
        <h2>Check out my work</h2>
        <p>Browse my gallery of recent freelance projects I did over the last 3 years</p>
        <br>
        <a href="#" class="btn">View my work</a>
    </div>
</section>

<!-- GRID -->
<section class="grid">
    <img src="https://via.placeholder.com/300">
    <img src="https://via.placeholder.com/300">
    <img src="https://via.placeholder.com/300">
    <img src="https://via.placeholder.com/300">
    <img src="https://via.placeholder.com/300">
    <img src="https://via.placeholder.com/300">
    <img src="https://via.placeholder.com/300">
    <img src="https://via.placeholder.com/300">
</section>

<!-- CTA -->
<section class="cta">
    <div>
        <h2>Hire me for your project</h2>
        <br>
        <a href="#" class="btn">Contact me</a>
    </div>
    <img src="https://via.placeholder.com/400x400">
</section>

</body>
</html>
